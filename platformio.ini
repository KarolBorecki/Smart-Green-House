; SPDX-License-Identifier: MIT
; Konfiguracja PlatformIO - sterownik szklarni ziolowej
; Dokumentacja: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

; ---------------------------------------------------------------------------
; Ustawienia wspolne
; ---------------------------------------------------------------------------
[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I src
build_unflags = -std=gnu++11
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --std=c++17
check_skip_packages = yes

; ---------------------------------------------------------------------------
; Testy jednostkowe logiki - kompilacja natywna (bez sprzetu), uzywane w CI
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -I lib/gh_domain/include
build_unflags =
build_src_filter = -<*>          ; kod Arduino nie jest kompilowany natywnie
lib_compat_mode = off
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_build_src = no

; ---------------------------------------------------------------------------
; Cel sprzetowy: ESP8266MOD (ESP-12E) - plytka NodeMCU v2 / Wemos D1
; ---------------------------------------------------------------------------
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    ${env.build_flags}
    -D GH_USE_I2C_MUX=1
    -D GH_LEVEL_SENSORS_DIRECT=0
    -D NDEBUG
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

; Wariant z aktualizacja przez sieci (OTA) - `pio run -e ota -t upload`
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = herb-greenhouse.local
upload_flags =
    --auth=${sysenv.GH_OTA_PASSWORD}

; Wariant bez multipleksera I2C - maksymalnie 2 tace, czujniki na 0x44/0x45
[env:nodemcuv2-nomux]
extends = env:nodemcuv2
build_flags =
    ${env.build_flags}
    -D GH_USE_I2C_MUX=0
    -D GH_LEVEL_SENSORS_DIRECT=1
    -D NDEBUG
